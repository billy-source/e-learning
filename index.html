const DB_KEY = 'learnhub-db-v2', SESSION_KEY = 'learnhub-session-v2', THEME_KEY = 'learnhub-theme';
const DAY = 864e5;
let db = { users: [], progress: {} };
try { const d = JSON.parse(localStorage.getItem(DB_KEY)); if (d && Array.isArray(d.users)) db = { users: d.users, progress: d.progress || {} }; } catch (e) {}
const persist = () => { try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) { toast('Could not save – browser storage is unavailable'); } };

const uid = () => 'u' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
function hashPw(pw, salt) { // demo-grade hash only – real apps must hash on the server
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57; const s = salt + pw;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}
function makeUser(name, email, password, role) {
  const salt = Math.random().toString(36).slice(2);
  return { id: uid(), name, email, salt, pass: password ? hashPw(password, salt) : '', role, created: Date.now(), lastActive: Date.now() };
}
if (!db.users.some(u => u.role === 'admin')) { db.users.push(makeUser('Administrator', 'admin@learnhub.com', 'admin123', 'admin')); persist(); }

const P = id => (db.progress[id] ||= { enrolled: [], done: {}, quiz: {}, log: [] });
const students = () => db.users.filter(u => u.role === 'student');
const userById = id => db.users.find(u => u.id === id);
const getCourse = id => COURSES.find(c => c.id === id);
function me() { try { const id = localStorage.getItem(SESSION_KEY); return id ? userById(id) || null : null; } catch (e) { return null; } }
function logEvent(userId, type, courseId, text, t = Date.now()) {
  const p = P(userId); p.log.push({ t, type, courseId, text }); if (p.log.length > 200) p.log.shift();
  const u = userById(userId); if (u) u.lastActive = t;
}

/* per-user derived values */
const isEnrolled = (cid, u) => !!u && P(u.id).enrolled.includes(cid);
const doneList = (cid, u) => (u ? P(u.id).done[cid] || [] : []);
const pctOf = (c, u) => Math.round((doneList(c.id, u).length / c.lessons.length) * 100);
const quizRec = (cid, u) => (u ? P(u.id).quiz[cid] : null) || null;
const passed = (cid, u) => (quizRec(cid, u)?.best ?? -1) >= PASS_MARK;
const isComplete = (c, u) => pctOf(c, u) === 100 && passed(c.id, u);
const statusOf = (c, u) => isComplete(c, u) ? 'Completed' : (pctOf(c, u) > 0 || quizRec(c.id, u)) ? 'In progress' : 'Not started';
const mean = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;

const go = h => { if (location.hash === h) route(); else location.hash = h; };
const fmtDate = t => t ? new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
function ago(t) {
  if (!t) return '—'; const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago'; if (s < 30 * 86400) return Math.floor(s / 86400) + ' d ago';
  return fmtDate(t);
}
function toast(msg) {
  const t = $('#toast'); t.innerHTML = `${icon('check', 'w-4 h-4')}<span>${esc(msg)}</span>`;
  t.classList.remove('opacity-0'); clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.add('opacity-0'), 2400);
}
const AV = ['bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300', 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300', 'bg-amber-100 text-amber-700 dark:bg-amber-900/50 dark:text-amber-300', 'bg-rose-100 text-rose-700 dark:bg-rose-900/50 dark:text-rose-300', 'bg-sky-100 text-sky-700 dark:bg-sky-900/50 dark:text-sky-300', 'bg-violet-100 text-violet-700 dark:bg-violet-900/50 dark:text-violet-300'];
function avatar(name, size = 'w-9 h-9 text-sm') {
  const n = String(name || '?').trim(); const parts = n.split(/\s+/);
  const ini = ((parts[0]?.[0] || '') + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase() || '?';
  let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `<span class="${size} ${AV[h % AV.length]} rounded-full inline-flex items-center justify-center font-semibold shrink-0">${esc(ini)}</span>`;
}

/* modal dialog – returns a Promise (true/false, or string for input) */
function dialog({ title, message = '', input = null, confirm = 'Confirm', cancel = 'Cancel', danger = false }) {
  return new Promise(resolve => {
    const d = $('#dlg');
    d.innerHTML = `<form method="dialog" class="p-6">
      <h2 class="text-lg font-semibold">${esc(title)}</h2>
      ${message ? `<p class="text-sm text-slate-500 dark:text-slate-400 mt-2">${esc(message)}</p>` : ''}
      ${input ? `<input id="dlgInput" class="${inputCls} mt-4" value="${esc(input.value || '')}" placeholder="${esc(input.placeholder || '')}" maxlength="40" />` : ''}
      <div class="flex justify-end gap-2 mt-6">
        ${cancel ? `<button value="cancel" class="${btnGhost}">${esc(cancel)}</button>` : ''}
        <button value="ok" class="${danger ? btnDanger : btnPrimary}">${esc(confirm)}</button>
      </div></form>`;
    d.onclose = () => {
      const ok = d.returnValue === 'ok';
      resolve(input ? (ok ? ($('#dlgInput')?.value || '').trim() : null) : ok);
      d.returnValue = '';
    };
    d.showModal(); $('#dlgInput')?.focus();
  });
}

let redirectTo = null;
function requireUser() { if (me()) return true; redirectTo = location.hash; go('#/login'); return false; }
function requireAdmin() { const u = me(); if (u && u.role === 'admin') return true; if (!u) { redirectTo = location.hash; go('#/login'); } else go('#/dashboard'); return false; }
function afterLogin(u) { const to = redirectTo; redirectTo = null; go(to && to !== '#/login' && to !== '#/signup' ? to : (u.role === 'admin' ? '#/admin' : '#/dashboard')); }

        <a href="#/${signup ? 'login' : 'signup'}" class="font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">${signup ? 'Sign in' : 'Create an account'}</a>
      </p>
    </div>
    ${signup ? '' : `<div class="mt-4 rounded-lg border border-dashed border-slate-300 dark:border-slate-700 p-4 text-xs text-slate-500 dark:text-slate-400 flex gap-3">
      ${icon('shield', 'w-5 h-5 mt-0.5')}<p><span class="font-semibold text-slate-700 dark:text-slate-200">Demo admin access:</span> admin@learnhub.com / admin123. Change this before using the platform for real.</p></div>`}
  </div>`;
  $('#authForm').addEventListener('submit', e => {
    e.preventDefault();
    const err = m => { const el = $('#authErr'); el.textContent = m; el.classList.remove('hidden'); };

          <div class="mt-4">${bar(pct)}</div>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">${done.length} of ${c.lessons.length} lessons · ${pct}%</p>
          <a href="#/learn/${id}/${nextIdx}" class="${btnPrimary} w-full mt-5">${pct === 0 ? 'Start course' : pct === 100 ? 'Review lessons' : 'Continue learning'}</a>
          ${complete ? `<a href="#/certificate/${id}" class="${btnGhost} w-full mt-2">${icon('cap', 'w-4 h-4')}View certificate</a>` : ''}
          <button id="unenroll" class="w-full mt-3 text-sm text-slate-500 hover:text-rose-600">Leave course</button>` : `
          <p class="font-semibold text-lg">Free course</p>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${u ? 'Enroll to unlock the lessons, track your progress and take the quiz.' : 'Create a free account to enroll and track your progress.'}</p>
          <button id="enroll" class="${btnPrimary} w-full mt-5">${u ? 'Enroll now' : 'Sign in to enroll'}</button>`}
      </aside>
    </div>`;

  $('#enroll')?.addEventListener('click', () => {
    if (!u) { redirectTo = '#/course/' + id; return go('#/login'); }
    P(u.id).enrolled.push(id); logEvent(u.id, 'enroll', id, `Enrolled in ${c.title}`); persist(); toast('You are enrolled'); viewCourse(id);
  });
  $('#unenroll')?.addEventListener('click', async () => {
    if (!await dialog({ title: 'Leave this course?', message: 'Your lesson progress and quiz score for this course will be removed.', confirm: 'Leave course', danger: true })) return;
    const p = P(u.id); p.enrolled = p.enrolled.filter(x => x !== id); delete p.done[id]; delete p.quiz[id];
    logEvent(u.id, 'leave', id, `Left ${c.title}`); persist(); viewCourse(id);
  });
  $$('[data-locked="true"]').forEach(a => a.addEventListener('click', () => toast(u ? 'Enroll to unlock this lesson' : 'Sign in and enroll to unlock')));
}

function viewLesson(id, idx) {
  const c = getCourse(id); idx = Number(idx); if (!c || !c.lessons[idx]) return viewNotFound();
  const u = me(); if (!u) { redirectTo = location.hash; return go('#/login'); }
  const preview = u.role === 'admin';
  if (!preview && !isEnrolled(id, u)) return go('#/course/' + id);
  const l = c.lessons[idx], done = doneList(id, u);
  const prev = idx > 0 ? `#/learn/${id}/${idx - 1}` : null;
  const next = idx < c.lessons.length - 1 ? `#/learn/${id}/${idx + 1}` : `#/quiz/${id}`;
  app.innerHTML = `
    <nav class="text-sm text-slate-500 dark:text-slate-400 mb-6 flex flex-wrap items-center gap-2" aria-label="Breadcrumb">
      <a href="#/" class="hover:text-indigo-600">Courses</a><span>/</span><a href="#/course/${id}" class="hover:text-indigo-600">${esc(c.title)}</a><span>/</span><span class="text-slate-800 dark:text-slate-200">Lesson ${idx + 1}</span></nav>
    <div class="grid lg:grid-cols-4 gap-8">
      <aside class="lg:col-span-1 order-2 lg:order-1 ${cardCls} p-4 h-fit lg:sticky lg:top-24">
        ${preview ? '' : `<div class="px-2 pt-1 pb-3">${bar(pctOf(c, u))}<p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5">${pctOf(c, u)}% complete</p></div>`}
        <ul class="space-y-0.5 text-sm">
          ${c.lessons.map((x, i) => `<li><a href="#/learn/${id}/${i}" class="flex items-center gap-3 px-3 py-2 rounded-lg ${i === idx ? 'bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300 font-semibold' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}">
            <span class="w-5 h-5 rounded-full inline-flex items-center justify-center text-[10px] ${done.includes(i) ? 'bg-emerald-500 text-white' : 'border border-slate-300 dark:border-slate-600'}">${done.includes(i) ? icon('check', 'w-3 h-3') : i + 1}</span><span>${esc(x.title)}</span></a></li>`).join('')}
          <li><a href="#/quiz/${id}" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"><span class="w-5 h-5 inline-flex items-center justify-center text-indigo-500">${icon('question', 'w-4 h-4')}</span><span>Final quiz</span></a></li>
        </ul>
      </aside>
      <article class="lg:col-span-3 order-1 lg:order-2 ${cardCls} p-6 sm:p-10">
        <p class="text-sm text-slate-500 dark:text-slate-400">Lesson ${idx + 1} of ${c.lessons.length} · ${l.minutes} min read</p>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mt-1">${esc(l.title)}</h1>
        <div class="prose-lesson mt-5 max-w-3xl">${l.content}</div>
        <div class="flex flex-wrap items-center gap-3 mt-10 pt-6 border-t border-slate-200 dark:border-slate-800">
          ${prev ? `<a href="${prev}" class="${btnGhost}">${icon('left', 'w-4 h-4')}Previous</a>` : ''}
          ${preview ? '' : `<button id="complete" class="${done.includes(idx) ? btnGhost : btnPrimary} sm:ml-auto">${done.includes(idx) ? `${icon('check', 'w-4 h-4')}Completed · undo` : 'Mark as complete'}</button>`}
          <a href="${next}" class="${btnPrimary} ${preview ? 'sm:ml-auto' : ''}">${idx === c.lessons.length - 1 ? 'Take quiz' : 'Next lesson'}${icon('right', 'w-4 h-4')}</a>
        </div>
      </article>
    </div>`;
  $('#complete')?.addEventListener('click', () => {
    const p = P(u.id), list = doneList(id, u), had = list.includes(idx);
    p.done[id] = had ? list.filter(x => x !== idx) : [...list, idx];
    if (!had) logEvent(u.id, 'lesson', id, `Completed “${l.title}” in ${c.title}`);
    persist();
    if (!had) toast(pctOf(c, u) === 100 ? 'All lessons complete – take the quiz' : 'Lesson completed');
    viewLesson(id, idx);
  });
}

function viewQuiz(id) {
  const c = getCourse(id); if (!c) return viewNotFound();
  const u = me(); if (!u) { redirectTo = location.hash; return go('#/login'); }
  const preview = u.role === 'admin';
  if (!preview && !isEnrolled(id, u)) return go('#/course/' + id);
  app.innerHTML = `
    ${backLink('#/course/' + id, esc(c.title))}
    <div class="max-w-2xl mx-auto">
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Final quiz</h1>
      <p class="text-slate-500 dark:text-slate-400 mt-1">${esc(c.title)} · ${c.quiz.length} questions · ${PASS_MARK}% to pass${preview ? ' · preview (not recorded)' : ''}</p>
      <form id="quizForm" class="mt-8 space-y-5">
        ${c.quiz.map((q, qi) => `<fieldset class="${cardCls} p-5 sm:p-6">
          <legend class="sr-only">Question ${qi + 1}</legend>
          <p class="font-semibold mb-4"><span class="text-indigo-600 dark:text-indigo-400 mr-1">${qi + 1}.</span>${esc(q.q)}</p>
          <div class="space-y-2">${q.options.map((o, oi) => `<label data-q="${qi}" data-o="${oi}" class="flex items-center gap-3 px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 text-sm">
            <input type="radio" name="q${qi}" value="${oi}" class="accent-indigo-600" /><span>${esc(o)}</span></label>`).join('')}</div></fieldset>`).join('')}
        <button class="${btnPrimary} w-full">Submit answers</button>
      </form>
      <div id="result" class="mt-6"></div>
    </div>`;
  $('#quizForm').addEventListener('submit', e => {
    e.preventDefault(); const fd = new FormData(e.target);
    if (c.quiz.some((_, i) => fd.get('q' + i) === null)) return toast('Please answer every question');
    let correct = 0;
    c.quiz.forEach((q, i) => {
      const chosen = Number(fd.get('q' + i)); if (chosen === q.answer) correct++;
      $$(`label[data-q="${i}"]`).forEach(lab => {
        const o = Number(lab.dataset.o); lab.classList.remove('border-slate-200', 'dark:border-slate-700');
        if (o === q.answer) lab.classList.add('border-emerald-500', 'bg-emerald-50', 'dark:bg-emerald-950/40');
        else if (o === chosen) lab.classList.add('border-rose-500', 'bg-rose-50', 'dark:bg-rose-950/40');
        lab.querySelector('input').disabled = true;
      });
    });
    const pct = Math.round((correct / c.quiz.length) * 100), ok = pct >= PASS_MARK;
    let certReady = false;
    if (!preview) {
      const wasComplete = isComplete(c, u), p = P(u.id), prev = p.quiz[id];
      p.quiz[id] = { best: Math.max(pct, prev?.best ?? 0), last: pct, attempts: (prev?.attempts || 0) + 1, at: Date.now(), passedAt: prev?.passedAt || (ok ? Date.now() : null) };
      logEvent(u.id, 'quiz', id, `Scored ${pct}% on the ${c.title} quiz`);
      if (!wasComplete && isComplete(c, u)) logEvent(u.id, 'complete', id, `Completed ${c.title}`);
      persist(); certReady = isComplete(c, u);
    }
    $('#result').innerHTML = `<div class="${cardCls} p-8 text-center">
      <p class="text-4xl font-bold tracking-tight ${ok ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'}">${pct}%</p>
      <p class="font-semibold mt-1">${correct} of ${c.quiz.length} correct</p>
      <p class="text-slate-500 dark:text-slate-400 mt-1 text-sm">${ok ? 'Well done, you passed.' : 'Not quite there yet. Review the lessons and try again.'}</p>
      <div class="flex flex-wrap gap-3 justify-center mt-6">
        <button id="retake" class="${btnGhost}">${icon('refresh', 'w-4 h-4')}Retake quiz</button>
        ${certReady ? `<a href="#/certificate/${id}" class="${btnPrimary}">${icon('cap', 'w-4 h-4')}Get certificate</a>` : `<a href="#/${preview ? 'course/' + id : 'dashboard'}" class="${btnPrimary}">${preview ? 'Back to course' : 'My Learning'}</a>`}
      </div></div>`;
    $('#quizForm button').disabled = true;
    $('#retake').onclick = () => viewQuiz(id);
    $('#result').scrollIntoView({ behavior: 'smooth' });
  });
}

  const u = me(); if (u.role === 'admin') return go('#/admin');

function adminTabs(active) {
  const t = (href, label, key) => `<a href="${href}" ${active === key ? 'aria-current="page"' : ''} class="px-4 py-2.5 text-sm font-medium border-b-2 -mb-px ${active === key ? 'border-indigo-600 text-indigo-700 dark:text-indigo-300 dark:border-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'}">${label}</a>`;
  return `<div class="flex gap-1 border-b border-slate-200 dark:border-slate-800 mb-8">${t('#/admin', 'Overview', 'overview')}${t('#/admin/students', 'Students', 'students')}${t('#/admin/courses', 'Courses', 'courses')}</div>`;
}

function studentSummary(u) {
  const p = P(u.id);
  const enrolledCourses = COURSES.filter(c => p.enrolled.includes(c.id));
  const progresses = enrolledCourses.map(c => pctOf(c, u));
  return {
    u, enrolled: enrolledCourses.length, completed: enrolledCourses.filter(c => isComplete(c, u)).length,
    progress: mean(progresses) ?? 0, quiz: mean(Object.values(p.quiz).map(q => q.best)), last: u.lastActive
  };
}

const EVENT_ICON = { enroll: 'book', lesson: 'check', quiz: 'question', complete: 'cap', leave: 'x' };

  const st = students(); const sums = st.map(studentSummary);
  const enrollments = sums.reduce((n, s) => n + s.enrolled, 0);
  const completions = sums.reduce((n, s) => n + s.completed, 0);
  const active7 = st.filter(u => Date.now() - u.lastActive < 7 * DAY).length;
  const allScores = st.flatMap(u => Object.values(P(u.id).quiz).map(q => q.best));
  const maxEnroll = Math.max(1, ...COURSES.map(c => st.filter(u => isEnrolled(c.id, u)).length));
  const feed = st.flatMap(u => P(u.id).log.map(e => ({ ...e, user: u }))).sort((a, b) => b.t - a.t).slice(0, 10);

  app.innerHTML = `${pageHead('Admin', 'Track student enrollment, progress and performance.',
    `<button id="exportAll" class="${btnGhost}">${icon('download', 'w-4 h-4')}Export CSV</button>`)}
    ${adminTabs('overview')}
    ${st.length === 0 ? `<div class="${cardCls} p-12 text-center">
      <span class="w-12 h-12 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-300 inline-flex items-center justify-center">${icon('users', 'w-6 h-6')}</span>

      <p class="text-slate-500 dark:text-slate-400 mt-1 max-w-md mx-auto">Students appear here as soon as they create an account. To see what the dashboard looks like, load a few sample students.</p>
      <button id="samples" class="${btnPrimary} mt-5">Load sample students</button></div>` : `
    <div class="grid grid-cols-2 lg:grid-cols-5 gap-4">
      ${stat('Students', st.length)}${stat('Active this week', active7, `${st.length ? Math.round(active7 / st.length * 100) : 0}% of students`)}
      ${stat('Enrollments', enrollments)}${stat('Course completions', completions)}${stat('Avg quiz score', allScores.length ? mean(allScores) + '%' : '—')}
    </div>
    <div class="grid lg:grid-cols-5 gap-6 mt-8">
      <section class="${cardCls} p-6 lg:col-span-2">
        <h2 class="font-semibold">Enrollment by course</h2>
        <div class="space-y-4 mt-5">${COURSES.map(c => { const n = st.filter(u => isEnrolled(c.id, u)).length; return `<div>
          <div class="flex justify-between text-sm mb-1.5"><span class="truncate pr-2">${esc(c.title)}</span><span class="font-semibold">${n}</span></div>${bar(Math.round(n / maxEnroll * 100))}</div>`; }).join('')}</div>
      </section>
      <section class="${cardCls} p-6 lg:col-span-3">
        <h2 class="font-semibold">Recent activity</h2>
        ${feed.length ? `<ul class="mt-4 divide-y divide-slate-100 dark:divide-slate-800">${feed.map(e => `<li class="py-3 flex items-start gap-3">
          <span class="mt-0.5 w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 inline-flex items-center justify-center">${icon(EVENT_ICON[e.type] || 'check', 'w-4 h-4')}</span>
          <div class="flex-1 min-w-0 text-sm"><p><a href="#/admin/student/${e.user.id}" class="font-semibold hover:text-indigo-600">${esc(e.user.name)}</a> <span class="text-slate-600 dark:text-slate-300">${esc(e.text)}</span></p></div>
          <span class="text-xs text-slate-500 whitespace-nowrap">${ago(e.t)}</span></li>`).join('')}</ul>` : `<p class="text-sm text-slate-500 mt-4">No activity yet.</p>`}
      </section>
    </div>`}`;
  $('#samples')?.addEventListener('click', () => { loadSamples(); toast('Sample students added'); viewAdminOverview(); });

      <td class="px-3 py-3.5">${s.enrolled}${s.completed ? ` <span class="text-xs text-emerald-600 dark:text-emerald-400">(${s.completed} done)</span>` : ''}</td>
      <td class="px-3 py-3.5"><div class="flex items-center gap-3"><div class="flex-1">${bar(s.progress)}</div><span class="text-xs w-8 text-right">${s.progress}%</span></div></td>
      <td class="px-3 py-3.5">${s.quiz == null ? '—' : s.quiz + '%'}</td>
      <td class="px-3 py-3.5 text-slate-600 dark:text-slate-300">${ago(s.last)}</td>
      <td class="px-3 py-3.5 text-slate-600 dark:text-slate-300">${fmtDate(s.u.created)}</td>
      <td class="px-5 py-3.5 text-right"><a href="#/admin/student/${s.u.id}" class="text-indigo-600 dark:text-indigo-400 font-medium hover:underline">View</a></td></tr>`).join('')
      : `<tr><td colspan="7" class="px-5 py-12 text-center text-slate-500">${st.length ? 'No students match your search.' : 'No students yet. They appear here once they sign up.'}</td></tr>`;
  };
  draw();
  $('#sq').addEventListener('input', e => { q = viewAdminStudents.q = e.target.value; draw(); });
  $('#ss').addEventListener('change', e => { sort = viewAdminStudents.sort = e.target.value; draw(); });

}

      const passRate = scores.length ? Math.round(scores.filter(q => q.best >= PASS_MARK).length / scores.length * 100) : null;
      return `<section class="${cardCls} p-6">

            .map(([k, v]) => `<div><dt class="text-xs text-slate-500 dark:text-slate-400">${k}</dt><dd class="text-xl font-bold mt-0.5">${v}</dd></div>`).join('')}

function exportCSV() {
  const cell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const head = ['Name', 'Email', 'Joined', 'Last active', 'Courses enrolled', 'Courses completed', 'Average progress %', 'Average quiz %'];
  const rows = students().map(studentSummary).map(s => [s.u.name, s.u.email, new Date(s.u.created).toISOString().slice(0, 10), new Date(s.u.lastActive).toISOString().slice(0, 10), s.enrolled, s.completed, s.progress, s.quiz ?? '']);
  const csv = [head, ...rows].map(r => r.map(cell).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `learnhub-students-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); URL.revokeObjectURL(a.href);
  toast('CSV downloaded');
}

];
function loadSamples() {
  const now = Date.now();
  SAMPLES.forEach(s => {
    if (db.users.some(u => u.email === s.email)) return;
    const u = { id: uid(), name: s.name, email: s.email, salt: '', pass: '', role: 'student', created: now - s.joined * DAY, lastActive: now - s.last * DAY, demo: true };
    db.users.push(u); const p = P(u.id);
    Object.entries(s.courses).forEach(([cid, d], ci) => {
      const c = getCourse(cid); const span = Math.max(1, s.joined - s.last);
      const t0 = u.created + DAY * (1 + ci);
      p.enrolled.push(cid); p.log.push({ t: t0, type: 'enroll', courseId: cid, text: `Enrolled in ${c.title}` });
      p.done[cid] = d.lessons || [];
      (d.lessons || []).forEach((li, k) => p.log.push({ t: Math.min(now - s.last * DAY, t0 + DAY * (k + 1) * 0.6), type: 'lesson', courseId: cid, text: `Completed “${c.lessons[li].title}” in ${c.title}` }));
      if (d.quiz != null) {
        const t = now - s.last * DAY - ci * 3600e3;
        p.quiz[cid] = { best: d.quiz, last: d.quiz, attempts: d.quiz < 60 ? 2 : 1, at: t, passedAt: d.quiz >= 60 ? t : null };
        p.log.push({ t, type: 'quiz', courseId: cid, text: `Scored ${d.quiz}% on the ${c.title} quiz` });
        if (isComplete(c, u)) p.log.push({ t: t + 1000, type: 'complete', courseId: cid, text: `Completed ${c.title}` });
      }
    });
  });
  persist();
}

/* ================================================================
   ROUTER
   ================================================================ */
function route() {
  const [page, a, b] = (location.hash || '#/').slice(2).split('/');
  renderHeader(); window.scrollTo(0, 0);
  switch (page) {
    case '': return viewHome();
    case 'login': return viewAuth('signin');
    case 'signup': return viewAuth('signup');
    case 'course': return viewCourse(a);
    case 'learn': return viewLesson(a, b);
    case 'quiz': return viewQuiz(a);
    case 'dashboard': return requireUser() && viewDashboard();
    case 'certificate': return requireUser() && viewCertificate(a);
    case 'admin':
      if (!requireAdmin()) return;
      if (!a) return viewAdminOverview();
      if (a === 'students') return viewAdminStudents();
      if (a === 'student') return viewAdminStudent(b);
      if (a === 'courses') return viewAdminCourses();
      return viewNotFound();
    default: return viewNotFound();
  }
}
window.addEventListener('hashchange', route);

route();
